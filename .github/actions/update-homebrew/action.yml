name: Update Homebrew formula
description: Publish an existing fastAI release from a repository checked out at the workspace root

inputs:
  version:
    description: Plain semantic version to publish
    required: true
  tap-token:
    description: Token with write access to the Homebrew tap
    required: true

runs:
  using: composite
  steps:
    - name: Require Homebrew tap token
      shell: bash
      env:
        TAP_GITHUB_TOKEN: ${{ inputs.tap-token }}
      run: |
        if [[ -z "$TAP_GITHUB_TOKEN" ]]; then
          printf 'Set TAP_GITHUB_TOKEN as a secret on the release environment in ericwooley/fastAI.\n' >&2
          exit 1
        fi

    - name: Download release archives
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
      run: |
        mkdir -p dist
        gh release download "v$VERSION" \
          --repo "$GITHUB_REPOSITORY" \
          --pattern 'fastAI_*' \
          --pattern 'checksums.txt' \
          --dir dist

    - name: Verify release checksums
      shell: bash
      working-directory: dist
      run: shasum -a 256 -c checksums.txt

    - name: Checkout Homebrew tap
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        repository: ericwooley/homebrew-apps
        ref: main
        path: homebrew-apps
        token: ${{ inputs.tap-token }}
        persist-credentials: false

    - name: Render Homebrew formula
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_WORKSPACE/scripts/render-homebrew-formula.sh" "$VERSION" dist/checksums.txt homebrew-apps/Formula/fastai.rb

    - name: Validate Homebrew formula
      shell: bash
      run: |
        ruby -c homebrew-apps/Formula/fastai.rb

        TAP_ROOT="$(brew --repository)/Library/Taps/ericwooley"
        TAP_PATH="$TAP_ROOT/homebrew-apps"
        if [[ -e "$TAP_PATH" ]]; then
          printf 'Unexpected pre-existing Homebrew tap path: %s\n' "$TAP_PATH" >&2
          exit 1
        fi

        mkdir -p "$TAP_ROOT"
        ln -s "$GITHUB_WORKSPACE/homebrew-apps" "$TAP_PATH"
        trap 'rm -f "$TAP_PATH"' EXIT

        HOMEBREW_NO_AUTO_UPDATE=1 brew style --formula ericwooley/apps/fastai
        HOMEBREW_NO_AUTO_UPDATE=1 brew install --formula ericwooley/apps/fastai
        HOMEBREW_NO_AUTO_UPDATE=1 brew test ericwooley/apps/fastai

        rm -f "$TAP_PATH"
        trap - EXIT

    - name: Commit Homebrew formula
      id: commit
      shell: bash
      working-directory: homebrew-apps
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [[ -z "$(git status --porcelain -- Formula/fastai.rb)" ]]; then
          printf 'Homebrew formula already matches fastAI %s.\n' "$VERSION"
          printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git add Formula/fastai.rb
        git \
          -c user.name='github-actions[bot]' \
          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          commit -m "chore: update fastAI to ${VERSION}"
        printf 'changed=true\n' >> "$GITHUB_OUTPUT"

    - name: Push Homebrew formula
      if: steps.commit.outputs.changed == 'true'
      shell: bash
      working-directory: homebrew-apps
      env:
        GH_TOKEN: ${{ inputs.tap-token }}
      run: |
        gh auth setup-git
        git push origin HEAD:main
