name: Update Homebrew

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing plain semantic version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-homebrew
  cancel-in-progress: false

jobs:
  update-homebrew:
    name: Publish fastAI formula
    runs-on: macos-latest
    timeout-minutes: 20
    environment: release

    steps:
      - name: Checkout publishing tools
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Publish Homebrew formula
        uses: ./.github/actions/update-homebrew
        with:
          version: ${{ inputs.version }}
          tap-token: ${{ secrets.TAP_GITHUB_TOKEN }}
